<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Rich Academic Notion Blue Gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1e36" />
      <stop offset="45%" stop-color="#102a4d" />
      <stop offset="100%" stop-color="#081426" />
    </linearGradient>

    <!-- Electric Cyan & Azure Blue Gradient for Text -->
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Blueprint Grid Pattern -->
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1d4ed8" stroke-width="0.75" opacity="0.25"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.35; }
      50% { opacity: 0.85; }
      100% { opacity: 0.35; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .grid-bg { animation: pulse 6s ease-in-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', sans-serif; font-weight: 800; font-size: 40px; fill: url(#accent_grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', sans-serif; font-weight: 500; font-size: 15px; fill: #cbd5e1; letter-spacing: 0.4px; }
    .tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; font-size: 11px; fill: #38bdf8; }
  </style>

  <!-- Background Base -->
  <rect width="850" height="200" rx="16" fill="url(#bg_grad)" stroke="#1d4ed8" stroke-width="1.5" stroke-opacity="0.6" />
  
  <!-- Subtle Blueprint Grid Overlay -->
  <rect width="850" height="200" rx="16" fill="url(#grid)" class="grid-bg" />

  <!-- Ambient Blue Glow Orbs -->
  <circle cx="140" cy="50" r="90" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle cx="740" cy="130" r="110" fill="#2563eb" opacity="0.15" filter="url(#glow)"/>

  <!-- Tagline Pill (Top Left) -->
  <g transform="translate(36, 24)">
    <rect width="170" height="28" rx="8" fill="#0b2440" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
    <text x="14" y="18" class="tag">&gt; song_uylong.init()</text>
  </g>

  <!-- Name & Main Title -->
  <text x="36" y="105" class="title">Song Uylong</text>
  <text x="310" y="105" class="cursor" fill="#38bdf8" font-family="monospace" font-size="38" font-weight="700">_</text>

  <!-- Subtitle / Bio Highlights -->
  <text x="36" y="145" class="subtitle">Full-Stack Engineer &amp; AI Workflow Researcher <tspan fill="#38bdf8" font-weight="600">@ sala.co</tspan></text>
  <text x="36" y="170" class="subtitle">Backend Developer &amp; RAG Engineer <tspan fill="#60a5fa" font-weight="600">@ Paragon International University</tspan></text>

  <!-- Decorative Blue Dots (Top & Bottom Right) -->
  <g transform="translate(730, 28)" opacity="0.8">
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
    <circle cx="16" cy="0" r="3.5" fill="#60a5fa" />
    <circle cx="32" cy="0" r="3.5" fill="#93c5fd" />
    <circle cx="48" cy="0" r="3.5" fill="#bfdbfe" />
  </g>
  <g transform="translate(680, 160)" opacity="0.8">
    <circle cx="0" cy="0" r="3.5" fill="#38bdf8" />
    <circle cx="16" cy="0" r="3.5" fill="#60a5fa" />
    <circle cx="32" cy="0" r="3.5" fill="#93c5fd" />
    <circle cx="48" cy="0" r="3.5" fill="#bfdbfe" />
  </g>
</svg>
