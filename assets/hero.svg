<svg width="850" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Accent Gradient for Text -->
    <linearGradient id="accent_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" opacity="0.6"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 0.8; }
      100% { opacity: 0.3; }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    .grid-bg { animation: pulse 8s ease-in-out infinite; }
    .cursor { animation: blink 1s step-end infinite; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', sans-serif; font-weight: 800; font-size: 40px; fill: url(#accent_grad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', sans-serif; font-weight: 500; font-size: 15px; fill: #94a3b8; letter-spacing: 0.5px; }
    .tag { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 600; font-size: 12px; fill: #38bdf8; }
    .status { font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 500; font-size: 11px; fill: #10b981; }
  </style>

  <!-- Background Base -->
  <rect width="850" height="200" rx="16" fill="url(#bg_grad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid Overlay -->
  <rect width="850" height="200" rx="16" fill="url(#grid)" class="grid-bg" />

  <!-- Ambient Glow Orbs -->
  <circle cx="120" cy="60" r="80" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="750" cy="140" r="100" fill="#818cf8" opacity="0.08" filter="url(#glow)"/>

  <!-- Status Chip (Top Right) -->
  <g transform="translate(630, 24)">
    <rect width="185" height="28" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#10b981" />
    <circle cx="16" cy="14" r="8" fill="#10b981" opacity="0.25" />
    <text x="30" y="18" class="status">OPEN TO RESEARCH &amp; COLLAB</text>
  </g>

  <!-- Tagline Pill (Top Left) -->
  <g transform="translate(36, 24)">
    <rect width="180" height="26" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="14" y="17" class="tag">&gt; song_uylong.init()</text>
  </g>

  <!-- Name & Main Title -->
  <text x="36" y="105" class="title">Song Uylong</text>
  <text x="310" y="105" class="cursor" fill="#38bdf8" font-family="monospace" font-size="38" font-weight="700">_</text>

  <!-- Subtitle / Bio Highlights -->
  <text x="36" y="145" class="subtitle">Full-Stack Engineer &amp; AI Workflow Researcher <tspan fill="#38bdf8">@ sala.co</tspan></text>
  <text x="36" y="170" class="subtitle">Backend Developer &amp; RAG Engineer <tspan fill="#818cf8">@ Paragon International University</tspan></text>

  <!-- Tech Dots Decorator (Bottom Right) -->
  <g transform="translate(650, 160)" opacity="0.6">
    <circle cx="0" cy="0" r="3" fill="#38bdf8" />
    <circle cx="15" cy="0" r="3" fill="#818cf8" />
    <circle cx="30" cy="0" r="3" fill="#c084fc" />
    <circle cx="45" cy="0" r="3" fill="#38bdf8" />
    <circle cx="60" cy="0" r="3" fill="#818cf8" />
    <circle cx="75" cy="0" r="3" fill="#c084fc" />
  </g>
</svg>
